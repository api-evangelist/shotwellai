name: Shotwellai
description: Shotwell AI is a Y Combinator-backed startup building an observability
  and annotation layer for robotics training data. Its pipeline ingests raw teleoperation
  video, robot logs, and multimodal sensor streams, then uses models to watch every
  frame, segment continuous motion into discrete actions, and label each action against
  a customer's task definition and SOP rubric. Every label is quality-scored and returned
  in hours rather than weeks, producing dense, frame-accurate, training-ready datasets
  for robot manipulation, deformable/folding tasks, teleoperation episode QA, and
  vision-language-action (VLA) foundation-model post-training. As of enrichment the
  company exposes only a marketing website and a sales contact (hello@shotwell.ai);
  no public API, developer portal, documentation, or SDKs were found.
